<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <radialGradient id="studioGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#FBF7F4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#EFE6E0" stop-opacity="0.3"/>
    </radialGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(30, 20, 20, 0.28)"/>
      <stop offset="50%" stop-color="rgba(30, 20, 20, 0.12)"/>
      <stop offset="100%" stop-color="rgba(30, 20, 20, 0)"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D7C4B7"/>
      <stop offset="35%" stop-color="#F4ECE6"/>
      <stop offset="70%" stop-color="#E5D6CC"/>
      <stop offset="100%" stop-color="#CBB5A7"/>
    </linearGradient>
    <linearGradient id="standGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3D3A38"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#2B2826"/>
    </linearGradient>
  </defs>

  <!-- Studio Ambient Backdrop -->
  <rect width="800" height="1200" fill="url(#studioGlow)" rx="24"/>

  <!-- Floor Shadow -->
  <ellipse cx="400" cy="1130" rx="220" ry="24" fill="url(#floorShadow)"/>
  <ellipse cx="400" cy="1132" rx="140" ry="14" fill="rgba(20, 10, 10, 0.18)"/>

  <!-- Mannequin Base & Stand -->
  <!-- Base Disk -->
  <ellipse cx="400" cy="1125" rx="100" ry="16" fill="url(#standGrad)"/>
  <ellipse cx="400" cy="1122" rx="90" ry="13" fill="#D4AF37" opacity="0.6"/>
  <!-- Central Metal Pole -->
  <rect x="395" y="700" width="10" height="425" fill="url(#standGrad)" rx="3"/>
  <line x1="400" y1="700" x2="400" y2="1125" stroke="#FFF" stroke-width="1.5" opacity="0.4"/>

  <!-- Mannequin Torso & Body Form -->
  <!-- Neck / Top Finial -->
  <ellipse cx="400" cy="170" rx="22" ry="10" fill="url(#standGrad)"/>
  <path d="M388 170 L392 210 L408 210 L412 170 Z" fill="url(#standGrad)"/>
  <ellipse cx="400" cy="210" rx="32" ry="12" fill="url(#bodyGrad)"/>

  <!-- Shoulders & Torso Silhuette -->
  <!-- Smooth couture dress form shape -->
  <path d="M400 210
           C340 215 285 245 270 290
           C260 320 275 380 290 420
           C305 460 310 490 310 520
           C310 550 285 620 285 680
           C285 730 320 780 370 790
           L385 792 L385 960
           C385 990 375 1060 375 1100
           L392 1100 L395 792
           L405 792 L408 1100
           L425 1100
           C425 1060 415 990 415 960
           L415 792 L430 790
           C480 780 515 730 515 680
           C515 620 490 550 490 520
           C490 490 495 460 510 420
           C525 380 540 320 530 290
           C515 245 460 215 400 210 Z"
        fill="url(#bodyGrad)" stroke="#BFA89B" stroke-width="2"/>

  <!-- Tailoring Seam Lines for realism -->
  <path d="M400 220 L400 780" stroke="#BFA89B" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>
  <path d="M340 250 C350 360 355 480 360 780" stroke="#BFA89B" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <path d="M460 250 C450 360 445 480 440 780" stroke="#BFA89B" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <!-- Bust Seam line -->
  <path d="M305 380 Q400 420 495 380" stroke="#BFA89B" stroke-width="1" stroke-dasharray="4,4" fill="none" opacity="0.4"/>
  <!-- Waist Seam line -->
  <path d="M312 520 Q400 535 488 520" stroke="#BFA89B" stroke-width="1.2" stroke-dasharray="5,4" fill="none" opacity="0.5"/>
  <!-- Hip Seam line -->
  <path d="M292 660 Q400 680 508 660" stroke="#BFA89B" stroke-width="1" stroke-dasharray="4,4" fill="none" opacity="0.4"/>

  <!-- Studio Watermark / Brand Badge -->
  <text x="400" y="525" text-anchor="middle" font-family="'Cinzel', serif, system-ui" font-size="13" font-weight="bold" fill="#A58E82" letter-spacing="3" opacity="0.7">MODAPELLA</text>
  <text x="400" y="542" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#BFA89B" letter-spacing="1.5" opacity="0.6">STUDIO ATELIER</text>
</svg>