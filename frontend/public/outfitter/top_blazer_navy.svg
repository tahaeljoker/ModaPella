<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <filter id="topShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="rgba(20,10,10,0.25)"/>
    </filter>
    <linearGradient id="fabricShade_blazer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <g filter="url(#topShadow)">
    
    <!-- Italian Tailored Blazer -->
    <!-- Collar & Lapels Background -->
    <path d="M345 220 L400 260 L455 220 L480 235 L400 300 L320 235 Z" fill="#1E293B" opacity="0.9"/>
    <!-- Blazer Main Body & Shoulders -->
    <path d="M400 230
             L330 235
             C290 245 240 280 220 360
             C210 400 205 460 200 520
             C195 560 220 575 235 560
             C250 540 265 470 275 420
             L280 640
             C280 670 320 685 400 685
             C480 685 520 670 520 640
             L525 420
             C535 470 550 540 565 560
             C580 575 605 560 600 520
             C595 460 590 400 580 360
             C560 280 510 245 470 235
             Z"
          fill="#1E293B"/>

    <!-- Fabric Sheen & Texture Overlay -->
    <path d="M400 230
             L330 235
             C290 245 240 280 220 360
             C210 400 205 460 200 520
             C195 560 220 575 235 560
             C250 540 265 470 275 420
             L280 640
             C280 670 320 685 400 685
             C480 685 520 670 520 640
             L525 420
             C535 470 550 540 565 560
             C580 575 605 560 600 520
             C595 460 590 400 580 360
             C560 280 510 245 470 235
             Z"
          fill="url(#fabricShade_blazer)" mix-blend-mode="overlay"/>

    <!-- Sharp Peak Lapels -->
    <path d="M340 230 L380 380 L320 400 L345 310 Z" fill="#1E293B" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <path d="M460 230 L420 380 L480 400 L455 310 Z" fill="#1E293B" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <!-- V-Neck Opening and Inner Vest line -->
    <path d="M380 380 L400 520 L420 380" stroke="rgba(0,0,0,0.3)" stroke-width="2" fill="none"/>
    <line x1="400" y1="520" x2="400" y2="685" stroke="rgba(0,0,0,0.4)" stroke-width="2"/>
    <!-- Gold/Horn Luxury Buttons -->
    <circle cx="400" cy="535" r="5" fill="#D4AF37" stroke="#997A15" stroke-width="1"/>
    <circle cx="400" cy="580" r="5" fill="#D4AF37" stroke="#997A15" stroke-width="1"/>
    <!-- Pockets -->
    <rect x="295" y="580" width="60" height="6" rx="2" fill="rgba(0,0,0,0.25)"/>
    <rect x="445" y="580" width="60" height="6" rx="2" fill="rgba(0,0,0,0.25)"/>
    <rect x="310" y="380" width="45" height="4" rx="1.5" fill="rgba(0,0,0,0.2)"/>
    
  </g>
</svg>