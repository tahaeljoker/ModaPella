<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <filter id="accShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="10" stdDeviation="12" flood-color="rgba(10,5,5,0.35)"/>
    </filter>
    <linearGradient id="bagLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <g filter="url(#accShadow)">
    <!-- Leather Shoulder Strap hanging from shoulder -->
    <path d="M480 320 C520 380 565 480 565 600" stroke="#8B4513" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M480 320 C520 380 565 480 565 600" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="6,4" fill="none"/>

    <!-- Bag Main Body -->
    <rect x="520" y="590" width="150" height="130" rx="16" fill="#8B4513"/>
    <rect x="520" y="590" width="150" height="130" rx="16" fill="url(#bagLeather)"/>
    <rect x="520" y="590" width="150" height="130" rx="16" stroke="rgba(212,175,55,0.4)" stroke-width="1.5" fill="none"/>

    <!-- Front Flap -->
    <path d="M520 590 L670 590 L670 655 C670 675 650 685 595 685 C540 685 520 675 520 655 Z" fill="#8B4513" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
    <!-- Gold Hardware Clasp & ModaPella Monogram -->
    <rect x="583" y="665" width="24" height="28" rx="4" fill="#D4AF37" stroke="#A88219" stroke-width="1.5"/>
    <circle cx="595" cy="679" r="4" fill="#7C0A12"/>
    <circle cx="595" cy="679" r="2" fill="#D4AF37"/>
    <!-- Gold Side Rings -->
    <circle cx="530" cy="595" r="7" fill="none" stroke="#D4AF37" stroke-width="3"/>
    <circle cx="660" cy="595" r="7" fill="none" stroke="#D4AF37" stroke-width="3"/>
  </g>
</svg>